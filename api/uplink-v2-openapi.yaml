openapi: 3.1.0
info:
  title: Yggdrasil Leviathan Uplink API v2
  version: 2.0.0
  description: Hardware-neutral whole-machine observations; Yggdrasil resolves machine identity from the bearer credential.
paths:
  /api/uplink/v2/snapshots:
    post:
      operationId: putUplinkV2Snapshot
      security: [{ machineBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
      responses:
        "202":
          description: Accepted, or the same receipt for an exact retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "400": { description: Invalid observation }
        "401": { description: Missing, expired, or revoked machine credential }
        "409": { description: Conflicting sequence or replay }
        "413": { description: Observation exceeds the configured body limit }
        "429": { description: Receiver busy; retry with backoff }
        "500": { description: Acceptance persistence failed }
components:
  securitySchemes:
    machineBearer:
      type: http
      scheme: bearer
  schemas:
    Envelope:
      type: object
      additionalProperties: false
      required: [schema, streamId, sequence, sampledAt, agent, host, system, health, accelerators, capabilities]
      properties:
        schema: { type: string, pattern: "^uplink-v2$" }
        streamId: { type: string, pattern: "^[A-Za-z0-9_-]{22}$", x-go-name: StreamID }
        sequence: { type: integer, format: uint64, minimum: 1 }
        sampledAt: { type: string, format: date-time }
        agent: { $ref: "#/components/schemas/Agent" }
        host: { $ref: "#/components/schemas/Host" }
        system: { $ref: "#/components/schemas/System" }
        health: { $ref: "#/components/schemas/Health" }
        accelerators:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/Accelerator" }
        capabilities:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/Capability" }
        network:
          $ref: "#/components/schemas/MetricSet"
          x-go-type-skip-optional-pointer: true
        extensions:
          type: object
          maxProperties: 64
          description: Optional metadata only; at most 64 KiB of encoded keys and values combined.
          additionalProperties: true
          x-go-type: map[string]json.RawMessage
          x-go-type-skip-optional-pointer: true
    Accelerator:
      type: object
      additionalProperties: false
      required: [id, kind, vendor, model, memory, metrics, partitions]
      properties:
        id: { type: string, minLength: 1, maxLength: 1024, x-go-name: ID }
        kind: { type: string, enum: [gpu, npu, other], x-go-type: string }
        vendor: { type: string, minLength: 1, maxLength: 128 }
        model: { type: string, maxLength: 1024 }
        memory: { $ref: "#/components/schemas/Memory" }
        metrics: { $ref: "#/components/schemas/MetricSet" }
        partitions:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/Partition" }
    Partition:
      type: object
      additionalProperties: false
      required: [id, parentId, kind, profile, memory, metrics]
      properties:
        id: { type: string, minLength: 1, maxLength: 1024, x-go-name: ID }
        parentId: { type: string, minLength: 1, maxLength: 1024, x-go-name: ParentID }
        kind: { type: string, minLength: 1, maxLength: 64 }
        profile: { type: string, maxLength: 1024 }
        memory: { $ref: "#/components/schemas/Memory" }
        metrics: { $ref: "#/components/schemas/MetricSet" }
    Capability:
      type: object
      additionalProperties: false
      required: [id, status, source]
      properties:
        id: { type: string, minLength: 1, maxLength: 128, x-go-name: ID }
        status: { type: string, enum: [available, unavailable, unsupported, degraded], x-go-type: string }
        source: { type: string, minLength: 1, maxLength: 128 }
    Receipt:
      type: object
      additionalProperties: false
      required: [status, streamId, sequence]
      properties:
        status: { $ref: "#/components/schemas/ReceiptStatus" }
        streamId:
          type: string
          pattern: "^[A-Za-z0-9_-]{22}$"
          x-go-name: StreamID
        sequence: { type: integer, format: uint64, minimum: 1 }
    ReceiptStatus:
      type: string
      enum: [accepted]
      x-enum-varnames: [ReceiptAccepted]
    Agent:
      x-go-type: uplinkv1.Agent
      x-go-type-import: { path: github.com/intellisys-stevens/yggdrasil/internal/uplinkv1, name: uplinkv1 }
      type: object
      additionalProperties: false
      required: [version, commit, buildDate]
      properties:
        version: { type: string, maxLength: 1024 }
        commit: { type: string, maxLength: 1024 }
        buildDate: { type: string, maxLength: 1024 }
    Host:
      x-go-type: uplinkv1.Host
      x-go-type-import: { path: github.com/intellisys-stevens/yggdrasil/internal/uplinkv1, name: uplinkv1 }
      type: object
      additionalProperties: false
      required: [hostname, os, arch]
      properties:
        hostname: { type: string, minLength: 1, maxLength: 1024 }
        os:
          type: string
          minLength: 1
          maxLength: 1024
          x-go-name: OS
        arch: { type: string, minLength: 1, maxLength: 1024 }
    Metric:
      type: object
      additionalProperties: false
      required: [value, unit, source, scope, sampledAt, status]
      properties:
        value: { type: [number, "null"], format: double }
        unit: { $ref: "#/components/schemas/MetricUnit" }
        source: { $ref: "#/components/schemas/MetricSource" }
        scope: { $ref: "#/components/schemas/MetricScope" }
        sampledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/MetricStatus" }
    MetricStatus:
      type: string
      enum: [available, estimated, unavailable, permission_denied, unsupported, error, stale]
      x-go-type: string
      x-enum-varnames:
        - MetricAvailable
        - MetricEstimated
        - MetricUnavailable
        - MetricPermissionDenied
        - MetricUnsupported
        - MetricError
        - MetricStale
    MetricUnit:
      type: string
      minLength: 1
      maxLength: 64
      x-go-type: string
    MetricSource:
      type: string
      minLength: 1
      maxLength: 128
      x-go-type: string
    MetricScope:
      type: string
      minLength: 1
      maxLength: 128
      x-go-type: string
    Memory:
      x-go-type: uplinkv1.Memory
      x-go-type-import: { path: github.com/intellisys-stevens/yggdrasil/internal/uplinkv1, name: uplinkv1 }
      type: object
      additionalProperties: false
      required: [totalBytes, usedBytes, availableBytes, source, scope, sampledAt, status]
      properties:
        totalBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        usedBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        availableBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        source: { $ref: "#/components/schemas/MetricSource" }
        scope: { $ref: "#/components/schemas/MetricScope" }
        sampledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/MetricStatus" }
    SystemMemory:
      type: object
      additionalProperties: false
      required: [totalBytes, usedBytes, availableBytes, utilization, source, scope, sampledAt, status]
      properties:
        totalBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        usedBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        availableBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        utilization: { $ref: "#/components/schemas/Metric" }
        source: { $ref: "#/components/schemas/MetricSource" }
        scope: { $ref: "#/components/schemas/MetricScope" }
        sampledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/MetricStatus" }
    System:
      x-go-type: uplinkv1.System
      x-go-type-import: { path: github.com/intellisys-stevens/yggdrasil/internal/uplinkv1, name: uplinkv1 }
      type: object
      additionalProperties: false
      required: [cpu, memory, storage, sampledAt, status]
      properties:
        cpu:
          $ref: "#/components/schemas/CPU"
          x-go-name: CPU
        memory: { $ref: "#/components/schemas/SystemMemory" }
        storage: { $ref: "#/components/schemas/Storage" }
        sampledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/MetricStatus" }
    CPU:
      type: object
      additionalProperties: false
      required: [model, logicalProcessors, utilization, load1, load5, load15, source, sampledAt, status]
      properties:
        model: { type: string, maxLength: 1024 }
        logicalProcessors: { type: integer, minimum: 0, maximum: 1000000 }
        utilization: { $ref: "#/components/schemas/Metric" }
        load1: { $ref: "#/components/schemas/Metric" }
        load5: { $ref: "#/components/schemas/Metric" }
        load15: { $ref: "#/components/schemas/Metric" }
        source: { $ref: "#/components/schemas/MetricSource" }
        sampledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/MetricStatus" }
    Storage:
      type: object
      additionalProperties: false
      required: [totalBytes, usedBytes, availableBytes, readBytesPerSecond, writeBytesPerSecond, filesystems, source, scope, sampledAt, status]
      properties:
        totalBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        usedBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        availableBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        readBytesPerSecond: { $ref: "#/components/schemas/Metric" }
        writeBytesPerSecond: { $ref: "#/components/schemas/Metric" }
        filesystems:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/Filesystem" }
        source: { $ref: "#/components/schemas/MetricSource" }
        scope: { $ref: "#/components/schemas/MetricScope" }
        sampledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/MetricStatus" }
    Filesystem:
      type: object
      additionalProperties: false
      required: [id, mountPoint, fsType, totalBytes, usedBytes, availableBytes, source, scope, sampledAt, status]
      properties:
        id:
          type: string
          pattern: "^fs_[A-Za-z0-9_-]{22}$"
          x-go-name: ID
        mountPoint: { type: string, pattern: "^/", maxLength: 4096 }
        fsType:
          type: string
          minLength: 1
          maxLength: 64
          x-go-name: FSType
        totalBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        usedBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        availableBytes: { type: [integer, "null"], format: uint64, minimum: 0 }
        source: { $ref: "#/components/schemas/MetricSource" }
        scope: { $ref: "#/components/schemas/MetricScope" }
        sampledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/MetricStatus" }
    MetricSet:
      x-go-type: uplinkv1.MetricSet
      x-go-type-import: { path: github.com/intellisys-stevens/yggdrasil/internal/uplinkv1, name: uplinkv1 }
      type: object
      additionalProperties: { $ref: "#/components/schemas/Metric" }
    Health:
      x-go-type: uplinkv1.Health
      x-go-type-import: { path: github.com/intellisys-stevens/yggdrasil/internal/uplinkv1, name: uplinkv1 }
      type: object
      additionalProperties: false
      required: [status, system, gpu, diagnostics]
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
        system: { $ref: "#/components/schemas/DomainHealth" }
        gpu:
          $ref: "#/components/schemas/DomainHealth"
          x-go-name: GPU
        diagnostics:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/SafeDiagnostic" }
    HealthStatus:
      type: string
      enum: [ok, degraded, unavailable]
      x-enum-varnames: [HealthOK, HealthDegraded, HealthUnavailable]
    DomainHealth:
      type: object
      additionalProperties: false
      required: [status, sampledAt]
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
        sampledAt: { type: string, format: date-time }
    SafeDiagnostic:
      type: object
      additionalProperties: false
      required: [code, severity, summary, status]
      properties:
        code: { $ref: "#/components/schemas/DiagnosticCode" }
        severity: { $ref: "#/components/schemas/DiagnosticSeverity" }
        summary: { $ref: "#/components/schemas/DiagnosticSummary" }
        status: { $ref: "#/components/schemas/MetricStatus" }
    DiagnosticCode:
      type: string
      minLength: 1
      maxLength: 128
      x-go-type: string
    DiagnosticSeverity:
      type: string
      enum: [info, warning, error]
      x-go-type: string
    DiagnosticSummary:
      type: string
      minLength: 1
      maxLength: 1024
      x-go-type: string
