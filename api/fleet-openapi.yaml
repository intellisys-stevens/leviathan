openapi: 3.1.0
info:
  title: Leviathan fleet API
  version: 0.3.0
  description: Project-scoped multi-instance inventory, sanitized observations, and an optional authenticated telemetry uplink. No endpoint mutates cloud resources.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:1398
paths:
  /api/fleet/v1/state:
    get:
      operationId: getFleetState
      summary: Return the latest complete fleet observation.
      responses:
        "200":
          description: Current fleet state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetSnapshot" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/fleet/v1/events:
    get:
      operationId: getFleetEvents
      summary: Stream complete fleet observations as fleet server-sent events.
      responses:
        "200":
          description: A latest-state stream. Slow consumers may skip superseded observations.
          content:
            text/event-stream:
              schema: { type: string }
  /api/fleet/v1/version:
    get:
      operationId: getFleetBuildInfo
      summary: Return build metadata for the fleet controller.
      responses:
        "200":
          description: Immutable build metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildInfo" }
  /api/fleet/v1/uplink/{instanceUUID}:
    post:
      operationId: putFleetUplinkSnapshot
      summary: Submit a creator-authenticated snapshot claimed for one instance when the optional uplink is enabled.
      description: The bearer credential authenticates a Nova creator trust domain, not the individual VM. The instance UUID is a claim that is authorized against current inventory. This operation is served only by the dedicated uplink listener; dashboard and fleet-read routes are absent from that listener.
      servers:
        - url: http://127.0.0.1:1399
      security:
        - creatorBearer: []
      parameters:
        - name: instanceUUID
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UplinkEnvelope" }
      responses:
        "202":
          description: The newest valid sample was accepted into the bounded in-memory registry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UplinkAccepted" }
        "400": { $ref: "#/components/responses/UplinkRejected" }
        "401": { $ref: "#/components/responses/UplinkRejected" }
        "404": { $ref: "#/components/responses/UplinkRejected" }
        "409": { $ref: "#/components/responses/UplinkRejected" }
        "413": { $ref: "#/components/responses/UplinkRejected" }
        "429": { $ref: "#/components/responses/UplinkRejected" }
        "500": { $ref: "#/components/responses/UplinkRejected" }
  /healthz:
    get:
      operationId: fleetHealthz
      summary: Report controller readiness and inventory freshness.
      responses:
        "200":
          description: A current or cached fleet state is available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: No fleet state has been published yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
components:
  securitySchemes:
    creatorBearer:
      type: http
      scheme: bearer
      description: A creator-scoped token loaded by the Hub from a named environment variable.
  responses:
    Unavailable:
      description: No complete fleet state has been published yet.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UplinkRejected:
      description: The uplink request was rejected without disclosing token, creator, instance, or payload details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    FleetSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, sequence, observedAt, platforms]
      properties:
        schemaVersion: { type: string, const: fleet-v1 }
        sequence: { type: integer, format: uint64, minimum: 0 }
        observedAt: { type: string, format: date-time }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/PlatformObservation" }
    PlatformObservation:
      type: object
      additionalProperties: false
      required: [platform, inventory, instances]
      properties:
        platform: { $ref: "#/components/schemas/Platform" }
        inventory: { $ref: "#/components/schemas/InventoryHealth" }
        instances:
          type: array
          items: { $ref: "#/components/schemas/InstanceObservation" }
    Platform:
      type: object
      additionalProperties: false
      required: [id, displayName, kind]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
        displayName: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [host, openstack] }
        dashboardUrl:
          type: string
          description: An HTTPS URL or same-origin absolute path without credentials, query, or fragment.
    InventoryHealth:
      type: object
      additionalProperties: false
      required: [status, lastAttemptAt]
      properties:
        status: { type: string, enum: [available, stale, unavailable] }
        observedAt: { type: string, format: date-time }
        lastAttemptAt: { type: string, format: date-time }
        lastSuccessAt: { type: string, format: date-time }
        message: { type: string }
    Instance:
      type: object
      additionalProperties: false
      required: [uuid, name, creatorUsername, cloudState]
      description: Sanitized OpenStack inventory; metadata, tags, passwords, tokens, keypairs, and endpoints are never included.
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        creatorUsername: { type: string }
        cloudState:
          type: string
          enum: [active, shelved, shelved_offloaded, shutoff, building, paused, suspended, error, unknown]
        rawCloudState: { type: string }
        flavor: { type: string }
    InstanceObservation:
      type: object
      additionalProperties: false
      required: [instance, managed, agentProbeEligible, policyReason, agent]
      properties:
        instance: { $ref: "#/components/schemas/Instance" }
        managed:
          type: boolean
          description: An explicit UUID rule or exact authoritative Nova creator-ID rule manages this instance.
        agentProbeEligible:
          type: boolean
          description: Authorization matched, the cloud state is active, and at least one explicitly configured telemetry path is enabled.
        policyReason:
          type: string
          enum: [allowed, not_allowlisted, creator_mismatch, cloud_not_active, agent_not_configured]
        agent: { $ref: "#/components/schemas/AgentObservation" }
    AgentObservation:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [not_managed, not_configured, available, unreachable, stale, incompatible] }
        source:
          type: string
          enum: [leviathan_agent, exosphere_console, leviathan_uplink]
          description: Transport and fidelity tier that produced the retained snapshot.
        lastAttemptAt: { type: string, format: date-time }
        lastSuccessAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
        buildInfo: { $ref: "#/components/schemas/BuildInfo" }
        snapshot:
          allOf:
            - $ref: "./openapi.yaml#/components/schemas/Snapshot"
          description: A schema-v1 single-host snapshot with command lines and raw provider error details removed by the fleet controller.
        message: { type: string }
    BuildInfo:
      type: object
      required: [version, commit, buildDate]
      properties:
        version: { type: string }
        commit: { type: string }
        buildDate: { type: string }
    UplinkEnvelope:
      type: object
      additionalProperties: false
      required: [snapshot]
      properties:
        snapshot: { $ref: "./openapi.yaml#/components/schemas/Snapshot" }
        buildInfo: { $ref: "#/components/schemas/BuildInfo" }
    UplinkAccepted:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: accepted }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [starting, ok, degraded] }
        sequence: { type: integer, format: uint64, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
