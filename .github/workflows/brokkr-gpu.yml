name: Brokkr GPU experiment

on:
  workflow_dispatch:
    inputs:
      project:
        description: Browser project (all keeps the existing four-project experiment)
        type: choice
        required: true
        default: all
        options:
          - all
          - chromium-desktop-dark
          - chromium-desktop-light
          - chromium-narrow-dark
          - chromium-narrow-light
      probe:
        description: Queue one selected project for the explicit Brokkr GPU probe
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  hardware-browser:
    # Additional, manual coverage. Required software-rendered CI stays unchanged.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all","chromium-desktop-dark","chromium-desktop-light","chromium-narrow-dark","chromium-narrow-light"]'), inputs.project) &&
      ((inputs.probe == true && inputs.project != 'all') ||
       (inputs.probe != true && vars.BROKKR_ENABLED == 'true' && vars.BROKKR_GPU_ENABLED == 'true'))
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: >-
          ${{
            inputs.project == 'all' && fromJSON('["chromium-desktop-dark","chromium-desktop-light","chromium-narrow-dark","chromium-narrow-light"]') ||
            inputs.project == 'chromium-desktop-dark' && fromJSON('["chromium-desktop-dark"]') ||
            inputs.project == 'chromium-desktop-light' && fromJSON('["chromium-desktop-light"]') ||
            inputs.project == 'chromium-narrow-dark' && fromJSON('["chromium-narrow-dark"]') ||
            inputs.project == 'chromium-narrow-light' && fromJSON('["chromium-narrow-light"]') ||
            fromJSON('[]')
          }}
    # Hardware reruns still require Brokkr's GPU; never substitute hosted CPU tests.
    runs-on: >-
      ${{
        inputs.probe == true &&
        fromJSON(format('["self-hosted","linux","x64","brokkr","brokkr-gpu","brokkr-gpu-probe","brokkr-{0}-{1}-hardware-browser-{2}"]', github.run_id, github.run_attempt, matrix.project)) ||
        fromJSON(format('["self-hosted","linux","x64","brokkr","brokkr-gpu","brokkr-{0}-{1}-hardware-browser-{2}"]', github.run_id, github.run_attempt, matrix.project))
      }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_HARDWARE_GPU: "1"
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/nvidia_icd.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install chromium
        working-directory: web
      - name: Check NVIDIA Vulkan ICD
        run: test -r "$VK_DRIVER_FILES"
      - name: Verify NVIDIA WebGL rendering and GPU activity
        run: node scripts/check-hardware-gpu.mjs
        working-directory: web
      - name: Show hardware GPU evidence
        run: cat hardware-gpu.json
        working-directory: web
      - name: Run unchanged browser assertions
        run: npm run test:e2e -- --project="${{ matrix.project }}" --workers=1
        working-directory: web
      - name: Retain experiment evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: hardware-browser-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            web/test-results
            web/hardware-gpu.json
          if-no-files-found: ignore
          retention-days: 7
