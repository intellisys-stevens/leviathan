name: Brokkr GPU experiment

on:
  workflow_dispatch:
    inputs:
      project:
        description: Browser project (all keeps the existing four-project experiment)
        type: choice
        required: true
        default: all
        options:
          - all
          - chromium-desktop-dark
          - chromium-desktop-light
          - chromium-narrow-dark
          - chromium-narrow-light

permissions:
  contents: read

jobs:
  hardware-browser:
    # Additional, manual coverage. Required software-rendered CI stays unchanged.
    if: vars.BROKKR_ENABLED == 'true' && vars.BROKKR_GPU_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: >-
          ${{
            inputs.project == 'all' && fromJSON('["chromium-desktop-dark","chromium-desktop-light","chromium-narrow-dark","chromium-narrow-light"]') ||
            inputs.project == 'chromium-desktop-dark' && fromJSON('["chromium-desktop-dark"]') ||
            inputs.project == 'chromium-desktop-light' && fromJSON('["chromium-desktop-light"]') ||
            inputs.project == 'chromium-narrow-dark' && fromJSON('["chromium-narrow-dark"]') ||
            inputs.project == 'chromium-narrow-light' && fromJSON('["chromium-narrow-light"]') ||
            fromJSON('[]')
          }}
    runs-on: [self-hosted, linux, x64, brokkr, brokkr-gpu]
    timeout-minutes: 75
    env:
      PLAYWRIGHT_HARDWARE_GPU: "1"
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/nvidia_icd.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install chromium
        working-directory: web
      - name: Check NVIDIA Vulkan ICD
        run: test -r "$VK_DRIVER_FILES"
      - name: Verify NVIDIA rendering and run browser assertions
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
        run: |
          /usr/local/bin/brokkr-gpu-run bash -euo pipefail -c '
            node scripts/check-hardware-gpu.mjs
            cat hardware-gpu.json
            npm run test:e2e -- --project="$BROWSER_PROJECT" --workers=1
          '
        working-directory: web
      - name: Retain experiment evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: hardware-browser-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            web/test-results
            web/hardware-gpu.json
          if-no-files-found: ignore
          retention-days: 7
