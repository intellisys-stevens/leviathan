name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --no-banner --redact=100 --log-opts='--all' .

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit
        working-directory: web
      - run: npm run license:check
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run format -- --check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run generate:api
        working-directory: web
      - run: git diff --exit-code -- web/src/api.gen.ts
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- internal/webui/dist

  frontend-browser:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop-dark
          - chromium-desktop-light
          - chromium-narrow-dark
          - chromium-narrow-light
    runs-on: ubuntu-24.04
    # The full desktop suite takes about 27 minutes with software graphics.
    # Leave room for cold runner setup and retaining failure artifacts.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Install Chromium for dashboard regressions
        run: npx playwright install --with-deps chromium
        working-directory: web
      # Keep software-rendered GPU scenes from competing on the same runner.
      # Every existing project and assertion still runs on its own native host.
      - name: Run dashboard browser regressions
        run: npm run test:e2e -- --project="${{ matrix.project }}" --workers=1
        working-directory: web
      - name: Retain failed browser traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-${{ matrix.project }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  go:
    runs-on: ubuntu-24.04
    env:
      CGO_CFLAGS: -Wno-deprecated-declarations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify vendored uplink contract and generated Go DTOs
        run: scripts/verify-uplink-contract.sh
      - run: go generate ./internal/api
      - run: git diff --exit-code -- internal/api/wire.gen.go
      - name: Verify managed update contract and signature vectors
        run: scripts/verify-update-contract.sh
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build Kubernetes attribution bridge
        run: make build-bridge VERSION=0.4.1
      - name: Check Go dependency licenses
        run: |
          go run github.com/google/go-licenses/v2@v2.0.1 check ./cmd/leviathan --disallowed_types=forbidden,restricted,unknown
          go run github.com/google/go-licenses/v2@v2.0.1 check ./cmd/leviathan-kubernetes-bridge --disallowed_types=forbidden,restricted,unknown
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  automatic-setup-systemd:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CGO_CFLAGS: -Wno-deprecated-declarations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build disposable setup fixtures
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/automatic-setup-package"
          mkdir -p "$package"
          go build -trimpath -ldflags "-X github.com/intellisys-stevens/leviathan/internal/cli.Version=0.4.1 -X github.com/intellisys-stevens/leviathan/internal/cli.Commit=1111111111111111111111111111111111111111 -X github.com/intellisys-stevens/leviathan/internal/cli.BuildDate=2026-09-05T00:00:00Z" -o "$package/agent-new" ./cmd/leviathan
          go build -trimpath -ldflags "-X github.com/intellisys-stevens/leviathan/internal/cli.Version=0.4.2 -X github.com/intellisys-stevens/leviathan/internal/cli.Commit=2222222222222222222222222222222222222222 -X github.com/intellisys-stevens/leviathan/internal/cli.BuildDate=2026-09-05T00:00:00Z" -o "$package/agent-next" ./cmd/leviathan
          go build -trimpath -ldflags "-X github.com/intellisys-stevens/leviathan/internal/cli.Version=0.4.3 -X github.com/intellisys-stevens/leviathan/internal/cli.Commit=3333333333333333333333333333333333333333 -X github.com/intellisys-stevens/leviathan/internal/cli.BuildDate=2026-09-05T00:00:00Z" -o "$package/agent-setup-broken" ./internal/updater/testdata/setup-broken-agent
          go build -trimpath -ldflags "-X github.com/intellisys-stevens/leviathan/internal/cli.Version=0.4.4 -X github.com/intellisys-stevens/leviathan/internal/cli.Commit=4444444444444444444444444444444444444444 -X github.com/intellisys-stevens/leviathan/internal/cli.BuildDate=2026-09-05T00:00:00Z" -o "$package/agent-setup-future" ./cmd/leviathan
          # Test-only public root. These executables are never published.
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.Version=0.4.1 -X github.com/intellisys-stevens/leviathan/internal/updater.ReleasePublicKeys=eZRrIVpuolPS/SjQVWmCnGqOZHMZlp/iHGR2Uku9WlI" -o "$package/leviathan-updater" ./cmd/leviathan-updater
          go test -c -o "$package/automatic-setup.test" ./internal/updater
          cp scripts/install.sh "$package/install.sh"
          # These native fixtures must also run on the separately approved
          # Ubuntu 22.04 reboot VM. Never infer compatibility from GOARCH alone.
          for fixture in agent-new agent-next agent-setup-broken agent-setup-future automatic-setup.test; do
            required="$(objdump -T "$package/$fixture" | sed -n 's/.*(GLIBC_\([0-9][0-9.]*\)).*/\1/p' | sort -Vu | tail -n 1)"
            test -n "$required"
            test "$(printf '%s\n%s\n' 2.34 "$required" | sort -V | tail -n 1)" = 2.34
          done
          git rev-parse HEAD > "$package/SOURCE_COMMIT"
          (cd "$package" && sha256sum agent-new agent-next agent-setup-broken agent-setup-future leviathan-updater automatic-setup.test install.sh SOURCE_COMMIT > SHA256SUMS)
          sudo install -d -m 0700 /root/updater-package
          sudo cp "$package/"* /root/updater-package/
      - name: Retain exact-source native fixtures for approved reboot acceptance
        uses: actions/upload-artifact@v7
        with:
          name: updater-acceptance-fixtures-${{ matrix.runner }}
          path: ${{ runner.temp }}/automatic-setup-package
          compression-level: 0
          retention-days: 3
      - name: Verify generated installer on native systemd
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /proc/1/comm)" = systemd
          # runner-images makes /opt and /usr/local/bin world-writable.
          # Restore normal system-directory boundaries on this disposable VM.
          sudo chown root:root /opt /usr/local/bin
          sudo chmod 0755 /opt /usr/local/bin
          # Exercise the normal noexec /run boundary found on the approved
          # Ubuntu 22.04 host; never relax that host's mount permissions.
          sudo mount -o remount,noexec /run
          findmnt -no OPTIONS /run | grep -q '\bnoexec\b'
          printf 'per-host-update-acceptance\n' | sudo tee /run/leviathan-updater-disposable-test >/dev/null
          sudo env LEVIATHAN_UPDATER_DISPOSABLE_HOST=1 /root/updater-package/automatic-setup.test -test.run '^TestSystemdAutomaticSetupAcceptance$' -test.v -test.timeout=720s | tee "$RUNNER_TEMP/automatic-setup.log"
          sudo cat /root/automatic-setup-receipt.json > "$RUNNER_TEMP/automatic-setup-receipt.json"
      - name: Retain public acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automatic-setup-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/automatic-setup.log
            ${{ runner.temp }}/automatic-setup-receipt.json
          if-no-files-found: ignore

  bridge-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Dry-run multi-architecture bridge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: contrib/container/leviathan-kubernetes-bridge.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          provenance: mode=max
          sbom: true
          tags: leviathan-kubernetes-bridge:ci
          build-args: |
            VERSION=0.4.1
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          cache-from: type=gha,scope=bridge-ci
          cache-to: type=gha,mode=max,scope=bridge-ci
      - name: Load native bridge image for metadata checks
        uses: docker/build-push-action@v7
        with:
          context: .
          file: contrib/container/leviathan-kubernetes-bridge.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: leviathan-kubernetes-bridge:ci
          build-args: |
            VERSION=0.4.1
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          cache-from: type=gha,scope=bridge-ci
      - name: Verify bridge image runtime metadata
        run: |
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' leviathan-kubernetes-bridge:ci)" = '["/leviathan-kubernetes-bridge"]'
          test "$(docker image inspect --format '{{.Config.User}}' leviathan-kubernetes-bridge:ci)" = '0:0'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.title"}}' leviathan-kubernetes-bridge:ci)" = 'Leviathan Kubernetes attribution bridge'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' leviathan-kubernetes-bridge:ci)" = 'https://github.com/intellisys-stevens/leviathan'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' leviathan-kubernetes-bridge:ci)" = '0.4.1'

  distribution-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.6
      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/*.sh
      - name: Verify clean product rename and release metadata
        run: |
          scripts/verify-branding.sh
          scripts/verify-release-metadata.sh 0.4.1
      - name: Test installer
        run: |
          scripts/install_test.sh
          python3 scripts/release-installer-test.py
          python3 scripts/sync-managed-installer.py --check
          python3 scripts/install-managed-test.py
          python3 scripts/bootstrap-updater-test.py
      - name: Dry-run Helm chart package
        id: chart
        run: |
          scripts/verify-helm-chart.sh
          mkdir -p dist
          helm package charts/leviathan-attribution --destination dist
          test -f dist/leviathan-attribution-0.4.1.tgz
          test "$(helm show chart dist/leviathan-attribution-0.4.1.tgz | awk '$1 == "version:" { print $2 }')" = 0.4.1
          test "$(helm show chart dist/leviathan-attribution-0.4.1.tgz | awk '$1 == "appVersion:" { print $2 }')" = 0.4.1
          echo 'package=dist/leviathan-attribution-0.4.1.tgz' >> "$GITHUB_OUTPUT"
      - name: Dry-run chart SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.chart.outputs.package }}
          format: spdx-json
          output-file: dist/leviathan-attribution_0.4.1.spdx.json
          upload-artifact: false
          upload-release-assets: false

  release-archive-dry-run:
    needs: distribution-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_CFLAGS: -Wno-deprecated-declarations
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build embedded dashboard
        working-directory: web
        run: npm ci && npm run build
      - name: Build and verify release archive
        id: archive
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/leviathan-package
          VERSION: v0.4.1
          LEVIATHAN_RELEASE_TEST_ONLY: "1"
          LEVIATHAN_UPDATE_PUBLIC_KEYS: 11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo
        run: |
          archive=$(scripts/build-release.sh)
          scripts/verify-release-archive.sh "$archive" "$VERSION" "$ARCHITECTURE"
          echo "package=$archive" >> "$GITHUB_OUTPUT"
      - name: Dry-run archive SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.archive.outputs.package }}
          format: spdx-json
          output-file: ${{ runner.temp }}/leviathan-package/leviathan_linux_${{ matrix.architecture }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
