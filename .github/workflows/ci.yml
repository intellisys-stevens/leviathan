name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --no-banner --redact=100 --log-opts='--all' .

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit
        working-directory: web
      - run: npm run license:check
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run format -- --check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run generate:api
        working-directory: web
      - run: git diff --exit-code -- web/src/api.gen.ts
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- internal/webui/dist

  go:
    runs-on: ubuntu-24.04
    env:
      CGO_CFLAGS: -Wno-deprecated-declarations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go generate ./internal/api
      - run: git diff --exit-code -- internal/api/wire.gen.go
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check Go dependency licenses
        run: go run github.com/google/go-licenses/v2@v2.0.1 check ./cmd/miglens --disallowed_types=forbidden,restricted,unknown
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  distribution:
    runs-on: ubuntu-24.04
    env:
      CGO_CFLAGS: -Wno-deprecated-declarations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Build embedded dashboard
        run: npm run build
        working-directory: web
      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/*.sh
      - name: Test installer
        run: scripts/install_test.sh
      - name: Build and verify release archive
        env:
          ARCHITECTURE: amd64
          OUTPUT_DIRECTORY: ${{ runner.temp }}/miglens-package
          VERSION: v0.1.0
        run: |
          archive=$(scripts/build-release.sh)
          scripts/verify-release-archive.sh "$archive" "$VERSION" "$ARCHITECTURE"
