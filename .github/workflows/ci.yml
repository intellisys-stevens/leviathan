name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit
        working-directory: web
      - run: npm run license:check
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run format -- --check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run generate:api
        working-directory: web
      - run: git diff --exit-code -- web/src/api.gen.ts
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- internal/webui/dist

  go:
    runs-on: ubuntu-24.04
    env:
      CGO_CFLAGS: -Wno-deprecated-declarations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go generate ./internal/api
      - run: git diff --exit-code -- internal/api/wire.gen.go
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check Go dependency licenses
        run: go run github.com/google/go-licenses/v2@v2.0.1 check ./cmd/miglens --disallowed_types=forbidden,restricted,unknown
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
