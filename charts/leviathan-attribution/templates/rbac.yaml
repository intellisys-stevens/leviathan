apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "leviathan-attribution.fullname" . }}
  labels:
    {{- include "leviathan-attribution.labels" . | nindent 4 }}
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "leviathan-attribution.fullname" . }}
  labels:
    {{- include "leviathan-attribution.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "leviathan-attribution.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "leviathan-attribution.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- range $namespace := .Values.workspaceNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "leviathan-attribution.fullname" $ }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "leviathan-attribution.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "leviathan-attribution.fullname" $ }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "leviathan-attribution.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "leviathan-attribution.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "leviathan-attribution.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
