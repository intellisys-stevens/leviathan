image:
  repository: ghcr.io/intellisys-stevens/miglens-kubernetes-bridge
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

workspaceNamespaces:
  - coder-workspaces

driver: gpu.nvidia.com

socketPath: /run/miglens/attribution.sock

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: false
  runAsUser: 0

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector:
  nvidia.com/gpu.present: "true"
tolerations: []
affinity: {}
priorityClassName: ""

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
