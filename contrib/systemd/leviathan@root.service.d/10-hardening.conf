[Service]
# Root is used only to inspect cross-user /proc metadata. Keep the capability
# set limited to directory/file reads and the kernel's ptrace access check.
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_SYS_PTRACE

# Full host /proc visibility is intentional for this instance. Do not replace
# these with ProtectProc=invisible or ProcSubset=pid.
ProtectProc=default
ProcSubset=all

ProtectSystem=strict
ProtectHome=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectClock=true
ProtectHostname=true
LockPersonality=true
MemoryDenyWriteExecute=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressDeny=any
IPAddressAllow=localhost
UMask=0077
