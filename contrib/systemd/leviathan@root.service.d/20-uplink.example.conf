# Example only. Copy this file to 20-uplink.conf and replace the documentation
# address with Yggdrasil's fixed ingress IP or narrow CIDR.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
# The hardened root unit cannot read root's default XDG configuration under
# ProtectHome=true. Point it at the root-owned deployment configuration in
# /etc; this argument contains no credential value.
ExecStart=
ExecStart=/usr/local/bin/leviathan --config /etc/leviathan/config.toml --listen 127.0.0.1:1397 serve

# The source stays root-owned and mode 0600. systemd copies it into the unit's
# private credential directory instead of exposing it in arguments or TOML.
LoadCredential=leviathan-uplink-token:/etc/leviathan/uplink.token

# 203.0.113.10 is TEST-NET-3 and cannot be a production destination.
# Replace it before installing this drop-in. The base unit retains
# IPAddressDeny=any and IPAddressAllow=localhost.
IPAddressAllow=203.0.113.10/32
