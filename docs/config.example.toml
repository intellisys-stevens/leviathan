# Leviathan configuration. CLI flags override LEVIATHAN_* environment
# variables, which override this file.
interval = "1s"                 # 250ms through 60s
profile_interval = "2s"         # expensive per-entity telemetry
process_interval = "2s"         # /proc GPU-client inventory
history_window = "12h"          # 1h raw + bounded compact trends; not persisted
topology_interval = "10s"
provider = "auto"               # auto, nvml, dcgm, or fake
dcgm_address = "127.0.0.1:5555"
show_command_line = false
no_profile = false
listen = "127.0.0.1:1397"       # non-loopback values are refused
no_color = false
ascii = false

# Optional scheduler attribution from the Kubernetes bridge. Empty disables
# attribution and makes no Kubernetes or local socket requests.
# attribution_socket = "/run/leviathan/attribution.sock"

# Optional latest-only telemetry uplink owned by `leviathan serve`. These
# controls are intentionally TOML-only. The bearer value itself must exist only
# in the private token file, never in this TOML, an environment variable, or a
# process argument.
[uplink]
enabled = false
base_url = ""
token_file = ""
interval = "15s"

# With the systemd LoadCredential example, enable the block above and use:
# base_url = "https://yggdrasil.example.edu"
# token_file = "/run/credentials/leviathan@root.service/leviathan-uplink-token"

# Development only. Any non-empty fixture selects the fake provider.
# fixture = "multi-ci"
